name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install Android SDK packages
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Build and test debug APK
        shell: bash
        run: |
          # This repository currently does not commit the Gradle wrapper scripts.
          # Use the wrapper if it exists; otherwise use Gradle installed by setup-gradle.
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew :app:assembleDebug :app:testDebugUnitTest --stacktrace
          else
            echo "gradlew not found; using the Gradle 9.3.1 installation from setup-gradle."
            gradle :app:assembleDebug :app:testDebugUnitTest --stacktrace
          fi
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rentora-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
